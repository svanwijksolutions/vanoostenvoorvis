    <path d="M12 30 L29 13 C32.5 9.5 38 9.5 40.5 12 C43 14.5 43 20 39.5 23.5 L23 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
