    <path d="M16 8 V16 M32 8 V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M17 29 L22 34 L32 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
