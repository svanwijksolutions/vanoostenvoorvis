    <path d="M13 30 L16 38 H32 L35 30 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M24 30 V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8 43 C11 41 13 41 16 43 C19 45 21 45 24 43 C27 41 29 41 32 43 C35 45 37 45 40 43" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
